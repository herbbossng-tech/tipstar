# Supabase local development configuration.
# See: https://supabase.com/docs/guides/local-development/cli/config
project_id = "tipstar"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[functions.telegram-webhook]
verify_jwt = false

[functions.telegram-init-auth]
verify_jwt = false

[functions.telegram-me]
# This function verifies the Tipstar session token itself (not a Supabase
# Auth JWT) and re-issues the request to PostgREST under that identity —
# see supabase/functions/telegram-me/index.ts.
verify_jwt = false
